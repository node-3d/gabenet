name: Test
defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            archflags: ''
          - target: windows-arm64
            os: windows-11-arm
            node_arch: arm64
            archflags: ''
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            archflags: ''
          - target: linux-arm64
            os: ubuntu-22.04-arm
            node_arch: arm64
            archflags: ''
          - target: darwin-x64
            os: macos-26
            node_arch: x64
            archflags: '-arch x86_64'
          - target: darwin-arm64
            os: macos-26
            node_arch: arm64
            archflags: '-arch arm64'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
          cache: 'npm'

      - name: Install Modules
        # This source checkout has no published gabenet archive to install. Build its
        # native dependency archives explicitly, then compile the current addon.
        run: npm ci --ignore-scripts

      - name: Install Native Dependencies
        run: npm rebuild @node-3d/deps-gns @node-3d/segfault --ignore-scripts=false

      - name: Build Current Binary
        run: npm run build:rebuild
        env:
          ARCHFLAGS: ${{ matrix.archflags }}

      - name: Run Unit Tests
        run: npm run test:ci
